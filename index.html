<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pythagorean Triplet Checker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kablammo&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<style>
  /* Kablammo just for the heading — everything else stays on the template */
  h1.kablammo {
    font-family: "Kablammo", system-ui;
    font-optical-sizing: auto;
    font-weight: 400;
    font-variation-settings: "MORF" 0;
  }
</style>
</head>
<body>
  <div class="page">
    <span class="eyebrow">spiced up my hs projects</span>
    <h1 class="kablammo">Pythagorean Triplet Checker</h1>
    <p>Enter three numbers (a, b, c):</p>

    <div class="card">
      <div class="field-row">
        <div>
          <label for="a">a</label>
          <input type="number" id="a" placeholder="3">
        </div>
        <div>
          <label for="b">b</label>
          <input type="number" id="b" placeholder="4">
        </div>
        <div>
          <label for="c">c</label>
          <input type="number" id="c" placeholder="5">
        </div>
      </div>

      <button onclick="Pytha()">Are they a triplet?</button>
      <div id="result" class="result"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
