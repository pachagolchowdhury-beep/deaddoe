<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixed Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8DC;
    --cream-dim:#F2E6BE;
    --red:#B3261E;
    --red-bright:#FF0000;
    --midnight:#191970;
    --midnight-light:#2B2B8C;
    --ink:#191970;
    --ink-muted:#5C5C8A;
    --radius:10px;
    --font-display:'Spectral',Georgia,serif;
    --font-body:'Work Sans',system-ui,sans-serif;
    --font-mono:'JetBrains Mono','Courier New',monospace;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font-body);
  }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .sheet{
    width:100%;
    max-width:460px;
    background:white;
    border:1px solid var(--midnight);
    border-radius:14px;
    box-shadow:0 8px 24px rgba(25,25,112,0.12);
    overflow:hidden;
  }

  .sheet-head{
    background:var(--midnight);
    padding:22px 28px;
    position:relative;
  }

  .sheet-head::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-6px;
    height:6px;
    background:var(--red);
  }

  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--cream-dim);
    opacity:0.8;
    margin:0 0 6px;
  }

  h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    color:var(--cream);
    margin:0;
  }

  .sheet-body{
    padding:26px 28px 30px;
  }

  .field-group{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
    margin-bottom:22px;
  }

  .field-group.split{
    grid-template-columns:1fr 1fr;
  }

  label.field-label{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:6px;
  }

  input[type="number"]{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1.5px solid #D8D2B0;
    background:var(--cream);
    color:var(--ink);
    font-family:var(--font-mono);
    font-size:15px;
  }

  input[type="number"]:focus{
    outline:none;
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(179,38,30,0.14);
  }

  .op-legend{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 10px;
  }

  .options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-bottom:24px;
  }

  .op-tile{
    position:relative;
  }

  .op-tile input{
    position:absolute;
    opacity:0;
    inset:0;
    margin:0;
    cursor:pointer;
  }

  .op-tile .tile-inner{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 12px;
    border-radius:8px;
    border:1.5px solid #D8D2B0;
    background:var(--cream);
    transition:border-color .12s ease, background .12s ease;
  }

  .op-tile .glyph{
    font-family:var(--font-mono);
    font-weight:500;
    font-size:14px;
    color:var(--midnight);
    width:28px;
    text-align:center;
  }

  .op-tile .name{
    font-size:13px;
    color:var(--ink);
  }

  .op-tile input:checked + .tile-inner{
    border-color:var(--red);
    background:#FFF0EE;
  }

  .op-tile input:checked + .tile-inner .glyph{
    color:var(--red);
  }

  .op-tile input:focus-visible + .tile-inner{
    box-shadow:0 0 0 3px rgba(179,38,30,0.18);
  }

  button.calc-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--red);
    color:var(--cream);
    font-family:var(--font-body);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:background .12s ease;
  }

  button.calc-btn:hover{
    background:#8F1E18;
  }

  #result{
    display:none;
    margin-top:18px;
    background:var(--midnight);
    border-radius:8px;
    padding:16px 18px;
    font-family:var(--font-mono);
    font-size:15px;
    color:var(--cream);
    text-align:right;
  }

  #result.show{
    display:block;
  }

  #result .error{
    color:#FFD3D0;
  }

  @media (max-width:420px){
    .field-group.split{grid-template-columns:1fr;}
    .options{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

  <div class="sheet">
    <div class="sheet-head">
      <p class="eyebrow">spiced up my hs projects</p>
      <h1>Mixed calculator</h1>
    </div>

    <div class="sheet-body">

      <div class="field-group">
        <div>
          <label class="field-label" for="number">Number</label>
          <input type="number" id="number" placeholder="Enter number">
        </div>
      </div>

      <div class="field-group split">
        <div>
          <label class="field-label" for="base">Base</label>
          <input type="number" id="base" placeholder="For power">
        </div>
        <div>
          <label class="field-label" for="exponent">Exponent</label>
          <input type="number" id="exponent" placeholder="For power">
        </div>
      </div>

      <p class="op-legend">Choose an operation</p>
      <div class="options">
        <label class="op-tile">
          <input type="radio" name="operation" value="power">
          <span class="tile-inner"><span class="glyph">x^y</span><span class="name">Power</span></span>
        </label>
        <label class="op-tile">
          <input type="radio" name="operation" value="sqrt">
          <span class="tile-inner"><span class="glyph">&#8730;x</span><span class="name">Square root</span></span>
        </label>
        <label class="op-tile">
          <input type="radio" name="operation" value="prime">
          <span class="tile-inner"><span class="glyph">P?</span><span class="name">Prime check</span></span>
        </label>
        <label class="op-tile">
          <input type="radio" name="operation" value="oddEven">
          <span class="tile-inner"><span class="glyph">±1</span><span class="name">Odd / even</span></span>
        </label>
        <label class="op-tile">
          <input type="radio" name="operation" value="absolute">
          <span class="tile-inner"><span class="glyph">|x|</span><span class="name">Absolute value</span></span>
        </label>
        <label class="op-tile">
          <input type="radio" name="operation" value="factorial">
          <span class="tile-inner"><span class="glyph">x!</span><span class="name">Factorial</span></span>
        </label>
        <label class="op-tile">
          <input type="radio" name="operation" value="log">
          <span class="tile-inner"><span class="glyph">log</span><span class="name">Logarithm</span></span>
        </label>
        <label class="op-tile">
          <input type="radio" name="operation" value="cbrt">
          <span class="tile-inner"><span class="glyph">&#8731;x</span><span class="name">Cube root</span></span>
        </label>
      </div>

      <button class="calc-btn" onclick="performCalculation()">Calculate</button>

      <div id="result"></div>

    </div>
  </div>

  <script>
    function calculatePower() {
        const base = parseFloat(document.getElementById("base").value);
        const exponent = parseFloat(document.getElementById("exponent").value);
        const result = base ** exponent;
        document.getElementById("result").innerHTML =
            `${base}<sup>${exponent}</sup> = <strong>${result}</strong>`;
    }

    function calculateSqrt() {
        const num = parseFloat(document.getElementById("number").value);
        if (num < 0) {
            document.getElementById("result").innerHTML =
                "<span class='error'>Error: Can't find square root of a negative number!</span>";
            return;
        }
        const sqrt = Math.sqrt(num);
        document.getElementById("result").innerHTML =
            `√${num} = <strong>${sqrt.toFixed(4)}</strong>`;
    }

    function FindPrimeNumber() {
        const num = parseInt(document.getElementById("number").value);
        if (num < 0) {
            document.getElementById("result").innerHTML =
                "<span class='error'>Error: Can't check for negative prime numbers!</span>";
            return;
        }
        const prime = isPrime(num);
        document.getElementById("result").innerHTML =
            `${num} is <strong>${prime ? "a prime number" : "not a prime number"}</strong>`;
    }

    function isPrime(n) {
        if (n <= 1) return false;
        for (let i = 2; i <= Math.sqrt(n); i++) {
            if (n % i === 0) return false;
        }
        return true;
    }

    function isOddorEven() {
        const num = parseInt(document.getElementById("number").value);
        const isEven = num % 2 === 0;
        document.getElementById("result").innerHTML =
            `${num} is <strong>${isEven ? "even" : "odd"}</strong>`;
    }

    function absoluteValue() {
        const num = parseFloat(document.getElementById("number").value);
        const absValue = Math.abs(num);
        document.getElementById("result").innerHTML =
            `|${num}| = <strong>${absValue}</strong>`;
    }

    function calculateFactorial() {
        const num = parseInt(document.getElementById("number").value);
        let factorial = 1;
        for (let i = 1; i <= num; i++) {
            factorial *= i;
        }
        document.getElementById("result").innerHTML =
            `${num}! = <strong>${factorial}</strong>`;
    }

    function calculateLogarithm() {
        const num = parseInt(document.getElementById("number").value);
        const logValue = Math.log(num);
        document.getElementById("result").innerHTML =
            `log(${num}) = <strong>${logValue.toFixed(4)}</strong>`;
    }

    function calculateCbrt() {
        const num = parseFloat(document.getElementById("number").value);
        const cbrtValue = Math.cbrt(num);
        document.getElementById("result").innerHTML =
            `∛${num} = <strong>${cbrtValue.toFixed(4)}</strong>`;
    }

    function performCalculation() {
        const result = document.getElementById("result");
        result.classList.add("show");

        const operation = document.querySelector('input[name="operation"]:checked');
        if (!operation) {
            result.innerHTML =
                "<span class='error'>Error: Please select an operation!</span>";
            return;
        }

        try {
            switch (operation.value) {
                case "power": calculatePower(); break;
                case "sqrt": calculateSqrt(); break;
                case "prime": FindPrimeNumber(); break;
                case "oddEven": isOddorEven(); break;
                case "absolute": absoluteValue(); break;
                case "factorial": calculateFactorial(); break;
                case "log": calculateLogarithm(); break;
                case "cbrt": calculateCbrt(); break;
                default:
                    result.innerHTML =
                        "<span class='error'>Error: Unknown operation!</span>";
            }
        } catch (err) {
            result.innerHTML =
                `<span class='error'>Error: ${err.message}</span>`;
        }
    }
  </script>

</body>
</html>
